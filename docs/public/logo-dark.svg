<svg xmlns="http://www.w3.org/2000/svg" width="248" height="40" viewBox="0 0 248 40" fill="none">
  <!-- Table columns; pinned one solid, others fading -->
  <rect x="4"  y="6" width="9" height="28" rx="2.5" fill="url(#rc_brand)"/>
  <rect x="16" y="6" width="9" height="28" rx="2.5" fill="url(#rc_brand)" opacity="0.6"/>
  <rect x="28" y="6" width="9" height="28" rx="2.5" fill="url(#rc_brand)" opacity="0.35"/>
  <!-- Resize handle -->
  <rect x="12" y="14" width="2.5" height="12" rx="1.25" fill="#7DD3FC"/>

  <!-- Wordmark -->
  <text x="48" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.6">Resizable Columns</text>

  <defs>
    <!-- sky-500 -> sky-300 -->
    <linearGradient id="rc_brand" x1="4" y1="6" x2="37" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>
</svg>
