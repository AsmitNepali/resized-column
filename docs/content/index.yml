seo:
  title: Resizable Columns for Filament
  description: A Filament plugin to resize, reorder, and pin table columns — with per-user persistence across sessions and devices. Add one trait and you're done.
title: "Give your tables\nresizable columns."
description: Let users drag to resize, drag to reorder, and pin Filament table columns. Widths, order, and pins all persist per user — via session or database.
hero:
  headline: "Filament v3 · v4 · v5"
  links:
    - label: Get started
      color: primary
      size: xl
      to: /getting-started/installation
    - label: View on GitHub
      size: xl
      color: neutral
      variant: soft
      icon: i-simple-icons-github
      target: _blank
      to: https://github.com/AsmitNepali/resized-column
terminal:
  lines:
    - segments:
        - text: "$ "
          style: prompt
        - text: "composer require"
          style: cmd
        - text: " asmit/resized-column"
          style: flag
    - segments:
        - text: "→ Discovering packages..."
          style: dim
        - text: " ✓"
          style: success
    - segments:
        - text: "$ "
          style: prompt
        - text: "php artisan"
          style: cmd
        - text: " filament:assets"
          style: flag
    - segments:
        - text: "→ Publishing plugin assets "
          style: dim
        - text: "✓"
          style: success
    - segments:
        - text: "→ Add "
          style: dim
        - text: "HasResizableColumn"
          style: cmd
        - text: " trait to your List page"
          style: dim
    - segments:
        - text: " "
          style: dim
    - segments:
        - text: "✓ Columns are now "
          style: success
        - text: "resizable, reorderable & pinnable"
          style: metric-good
logos:
  title: Built for the Laravel & Filament stack
  items:
    - i-simple-icons-laravel
    - i-simple-icons-livewire
    - i-simple-icons-php
    - i-simple-icons-alpinedotjs
    - i-simple-icons-tailwindcss
features:
  headline: Capabilities
  title: "Everything users want from a table."
  description: Drag, reorder, and pin — every preference saved automatically, per user, with no extra wiring.
  items:
    - icon: i-lucide-move-horizontal
      title: Drag to resize
      description: Drag a column border to set its width. Widths stick per user and reapply on the next visit.
    - icon: i-lucide-grip-vertical
      title: Drag to reorder
      description: A grip handle on each header reorders columns. Sticky columns are excluded. Order persists per user.
    - icon: i-lucide-pin
      title: Sticky columns
      description: Pin columns with sticky() so they stay visible during horizontal scroll. Left-pin only today.
    - icon: i-lucide-list-checks
      title: Pin columns panel
      description: stickableColumns() adds a toolbar dropdown — draft pins, Select all / Deselect all, then Apply. Choices persist per user.
    - icon: i-lucide-sliders-horizontal
      title: Custom pin trigger
      description: stickyManagerTriggerAction() customizes the Pin columns button — same pattern as columnManagerTriggerAction().
    - icon: i-lucide-database
      title: Persists per user
      description: Widths, order, and pins share one settings row. Session by default, or database across devices.
    - icon: i-lucide-layers
      title: Panels & standalone Livewire
      description: Works inside Filament panels and in plain Livewire components — one HasResizableColumn trait either way.
metrics:
  headline: By the numbers
  title: "Tiny footprint, big flexibility."
  description: One trait unlocks resizing, reordering, and pinning across every table — no per-column config and no extra migrations for pins.
  items:
    - value: "100K+"
      label: Downloads
      class: "text-primary"
    - value: "3"
      label: Filament majors (v3–v5)
      class: "text-success"
    - value: "1"
      label: Trait to enable
      class: "text-info"
    - value: "100%"
      label: Per-user persistence
      class: "text-warning"
cta:
  title: "Ready to ship\nflexible tables?"
  description: Install the package, add one trait, and your Filament tables become resizable, reorderable, and pinnable.
  command: composer require asmit/resized-column
  links:
    - label: Get started
      color: primary
      to: /getting-started/installation
